name: CI para Proyecto Node.js

on:
  push:
    branches:
      - sanchez  # Asegúrate de que sea la rama correcta

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out el código
        uses: actions/checkout@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Instalar dependencias
        run: npm install

      - name: Verificar instalación de Jest
        run: |
          if ! [ -x "$(command -v jest)" ]; then
            echo "Jest no está instalado correctamente";
            exit 1;
          fi

      - name: Ejecutar tests
        run: npm test
